<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Face Detection</title>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#3a0ca3 0%,transparent 30%),
        radial-gradient(circle at bottom right,#7209b7 0%,transparent 30%),
        linear-gradient(135deg,#050816,#0b1023,#050816);
    color:white;
    font-family:'Orbitron',sans-serif;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:30px;
}

/* BACKGROUND GLOW */
body::before{
    content:'';
    position:fixed;
    width:500px;
    height:500px;
    background:#00f7ff22;
    filter:blur(120px);
    top:-200px;
    left:-150px;
    z-index:-1;
}

body::after{
    content:'';
    position:fixed;
    width:500px;
    height:500px;
    background:#ff00ff22;
    filter:blur(120px);
    bottom:-200px;
    right:-150px;
    z-index:-1;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    font-size:42px;
    font-weight:700;
    letter-spacing:3px;
    margin-bottom:10px;
    background:linear-gradient(90deg,#00f7ff,#ff00ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:
        0 0 15px rgba(0,247,255,0.4),
        0 0 30px rgba(255,0,255,0.3);
}

.header p{
    color:#cfcfcf;
    font-size:14px;
    letter-spacing:2px;
}

/* DASHBOARD */
.dashboard{
    width:100%;
    max-width:1200px;
    display:flex;
    gap:25px;
    align-items:flex-start;
    justify-content:center;
    flex-wrap:wrap;
}

/* CAMERA CARD */
.camera-card{
    position:relative;
    width:700px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:25px;
    padding:20px;
    backdrop-filter:blur(18px);
    box-shadow:
        0 0 20px rgba(0,247,255,0.15),
        0 0 40px rgba(255,0,255,0.08);
}

/* STATUS */
.status-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.status{
    padding:10px 18px;
    border-radius:12px;
    background:rgba(0,247,255,0.1);
    border:1px solid #00f7ff55;
    color:#00f7ff;
    font-size:14px;
    font-weight:600;
    box-shadow:0 0 12px rgba(0,247,255,0.2);
}

.live-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#ff3b3b;
    box-shadow:0 0 15px #ff3b3b;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.4);}
    100%{transform:scale(1);}
}

/* VIDEO CONTAINER */
.container{
    position:relative;
    width:640px;
    height:480px;
    margin:auto;
    border-radius:20px;
    overflow:hidden;
    border:2px solid rgba(0,247,255,0.5);
    box-shadow:
        0 0 25px rgba(0,247,255,0.3),
        0 0 60px rgba(255,0,255,0.15);
}

video,
canvas#overlay{
    transfrom: scaleX(-1);
    position:absolute;
    top:0;
    left:0;
    width:640px;
    height:480px;
    object-fit:cover;
}

canvas#overlay{
    transfrom: scaleX(-1);
    z-index:5;
    pointer-events:none;
}

/* BUTTON */
.controls{
    display:flex;
    justify-content:center;
    margin-top:20px;
}

.btn-start{
    position:relative;
    overflow:hidden;
    padding:14px 40px;
    border:none;
    border-radius:14px;
    font-size:16px;
    font-weight:700;
    letter-spacing:1px;
    color:white;
    cursor:pointer;
    background:linear-gradient(90deg,#00f7ff,#8f00ff,#ff00ff);
    background-size:300%;
    transition:0.4s;
    box-shadow:
        0 0 20px rgba(0,247,255,0.3),
        0 0 35px rgba(255,0,255,0.2);
    animation:gradientMove 5s linear infinite;
}

.btn-start:hover{
    transform:translateY(-3px) scale(1.03);
    box-shadow:
        0 0 25px rgba(0,247,255,0.6),
        0 0 50px rgba(255,0,255,0.5);
}

@keyframes gradientMove{
    0%{background-position:0%;}
    100%{background-position:300%;}
}

/* SIDE PANEL */
.side-panel{
    width:320px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:25px;
    padding:20px;
    backdrop-filter:blur(18px);
    box-shadow:
        0 0 20px rgba(255,0,255,0.1);
}

.side-panel h3{
    margin-bottom:15px;
    color:#ff00ff;
    font-size:18px;
    text-align:center;
    letter-spacing:2px;
}

.info-box{
    background:rgba(0,0,0,0.35);
    border:1px solid rgba(0,247,255,0.2);
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
}

.info-box p{
    font-size:13px;
    line-height:1.8;
    color:#cfcfcf;
}

.highlight{
    color:#00f7ff;
    font-weight:bold;
}

.footer{
    margin-top:30px;
    font-size:12px;
    color:#888;
    letter-spacing:3px;
    text-transform:uppercase;
}

.footer span{
    color:#ff00ff;
}

/* RESPONSIVE */
@media(max-width:900px){

    .camera-card{
        width:100%;
    }

    .container{
        width:100%;
        height:auto;
        aspect-ratio:4/3;
    }

    video,
    canvas#overlay{
        width:100%;
        height:100%;
    }

    .side-panel{
        width:100%;
    }

    .header h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>AI FACE DETECTION</h1>
    <p>PROJECT BY RAAFI • RAGGA • ZIDDAN</p>
</div>

<div class="dashboard">

    <!-- CAMERA SECTION -->
    <div class="camera-card">

        <div class="status-bar">
            <div id="status" class="status">
                STATUS : OFFLINE
            </div>

            <div class="live-dot"></div>
        </div>

        <div class="container">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="overlay" width="640" height="480"></canvas>
        </div>

        <div class="controls">
            <button id="btn-init" class="btn-start">
                AKTIFKAN AI CAMERA
            </button>
        </div>
    </div>

    <!-- SIDE PANEL -->
    <div class="side-panel">
        <h3>SYSTEM INFO</h3>

        <div class="info-box">
            <p>
                <span class="highlight">MODEL :</span><br>
                ONNX Runtime AI
            </p>
        </div>

        <div class="info-box">
            <p>
                <span class="highlight">FITUR :</span><br>
                • Real-time Detection<br>
                • Face Tracking<br>
                • AI Recognition<br>
                • Live Overlay
            </p>
        </div>

        <div class="info-box">
            <p>
                <span class="highlight">STATUS ENGINE :</span><br>
                Waiting Initialization...
            </p>
        </div>
    </div>

</div>

<!-- Hidden Processor -->
<canvas id="processor" width="640" height="640" style="display:none;"></canvas>

<div class="footer">
    ENGINEERED WITH <span>AI TECHNOLOGY</span>
</div>

<script src="app.js"></script>

</body>
</html>
